<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favorites | Acute Realty</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/property-features.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="logo" href="index.html" aria-label="Acute Realty home">
          <img class="logo-image" src="assets/logo.jpeg" alt="Acute Realty" />
        </a>

        <button class="menu-toggle" aria-label="Open navigation">☰</button>

        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="properties.html">Properties</a>
          <a href="index.html#services">Services</a>
          <a href="contact.html">Contact</a>
          <a class="active" href="favorites.html">♡ Favorites <b id="favCount">0</b></a>
        </nav>
      </div>
    </header>

    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">SAVED PROPERTIES</p>
        <h1>Your favorites.</h1>
        <p>Keep track of properties you may want to revisit.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="property-grid" id="favoritesGrid"></div>

        <div id="emptyFavorites" class="empty-state" hidden>
          <h2>No saved properties yet.</h2>
          <p>Browse properties and tap the heart to save one here.</p>
          <a class="btn btn-dark" href="properties.html">Browse properties</a>
        </div>
      </div>
    </section>

    <footer>
      <div class="copyright">© 2026 Acute Realty. All rights reserved.</div>
    </footer>

    <script src="js/properties.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
